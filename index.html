
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stardew Valley</title>
    <link rel="icon" href="data:," />

    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* LOGIN PAGE */
        #login {
            position: fixed;
            inset: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            font-family: Arial, sans-serif;
        }

        .login-box {
            width: 90%;
            max-width: 340px;
            text-align: center;
        }

        .login-box h2 {
            font-size: 26px;
            font-weight: 500;
            color: #222;
            margin-bottom: 10px;
        }

        .login-box p {
            font-size: 14px;
            color: #777;
            margin-bottom: 25px;
        }

        .login-box input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
            margin-bottom: 15px;
            text-align: center;
        }

        .login-box input:focus {
            border-color: #888;
        }

        .login-box button {
            width: 100%;
            padding: 13px;
            background: #222;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .login-box button:hover {
            background: #444;
        }

        #error {
            color: #d33;
            font-size: 13px;
            margin-top: 12px;
            display: none;
        }

        #login.hidden {
            display: none;
        }

        /* GAME LOADING SCREEN */
        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font: 1.5rem/1 sans-serif;
            z-index: 1;
            flex-direction: column;
            gap: 1rem;
        }

        #loading.hidden {
            display: none;
        }

        #music-choice {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }

        #music-choice button {
            font: 1.1rem/1 sans-serif;
            padding: 0.6rem 1.5rem;
            border: 2px solid #fff;
            border-radius: 6px;
            background: transparent;
            color: #fff;
            cursor: pointer;
            min-width: 260px;
            transition: background 0.15s;
        }

        #music-choice button:hover {
            background: rgba(255,255,255,0.15);
        }

        #music-choice .hint {
            font-size: 0.85rem;
            opacity: 0.6;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
    </style>
</head>

<body>

    <!-- LOGIN PAGE -->
    <div id="login">
        <div class="login-box">
            <h2>Welcome</h2>
            <p>Please enter your password to continue.</p>

            <form id="login-form">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    autocomplete="current-password"
                    required
                />

                <button type="submit">Login</button>

                <div id="error">Incorrect password. Try again.</div>
            </form>
        </div>
    </div>

    <!-- GAME LOADING SCREEN -->
    <div id="loading">
        <div id="music-choice">
            <div>Download options</div>

            <button id="btn-no-music">
                Play without music <span class="hint">(~64 MB)</span>
            </button>

            <button id="btn-with-music">
                Play with music <span class="hint">(~540 MB)</span>
            </button>
        </div>
    </div>

    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script>
        const loginForm = document.getElementById("login-form");
        const passwordInput = document.getElementById("password");
        const loginPage = document.getElementById("login");
        const errorMessage = document.getElementById("error");

        loginForm.addEventListener("submit", function(event) {
            event.preventDefault();

            if (passwordInput.value === "avalon") {
                loginPage.classList.add("hidden");

                // Load the game only after successful login
                const script = document.createElement("script");
                script.type = "module";
                script.src = "game.js";
                document.body.appendChild(script);
            } else {
                errorMessage.style.display = "block";
                passwordInput.value = "";
                passwordInput.focus();
            }
        });
    </script>

</body>
</html>
